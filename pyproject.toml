[project]
name = "kernux-index"
version = "0.1.0"
description = "Kernux — the open, evidence-backed guide to AI coding agents. Profile index tooling."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Kernux Contributors" }]
dependencies = [
    "pyyaml>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
    "ruff>=0.8.4,<0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Exclude legacy OmniBridge prototype — Phase 1 must not modify it.
exclude = ["nexusmcp", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; we don't want to fail on long lines in this repo

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False style in tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
