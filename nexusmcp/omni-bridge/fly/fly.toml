app = "omni-bridge"
primary_region = "iad"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
concurrency = { type = "requests", soft_limit = 50, hard_limit = 100 }

[http_service.health_checks]
http_path = "/health"
initial_delay_seconds = 15
period_seconds = 30
timeout_seconds = 5
success_threshold = 2
failure_threshold = 3

[metrics]
path = "/metrics"
port = 3000
