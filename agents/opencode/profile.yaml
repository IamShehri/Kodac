notes:
  summary: >
    OpenCode is an open-source (MIT) AI coding agent maintained by Anomaly
    (github.com/anomalyco), available as a terminal TUI, desktop app, and IDE
    extension. Repository identity, license, and release metadata are
    artifact-verified; all behavioral, capability, protocol, pricing, and
    privacy fields are vendor-reported from official documentation, not
    independently reproduced. Telemetry behavior and the OS-level sandbox
    model are unknown because no acceptable direct source establishes them.
    This is a Phase 1 vertical slice: there is no Run evidence and no
    independent behavioral reproduction. The active project is
    github.com/anomalyco/opencode; github.com/opencode-ai/opencode is an
    archived, unrelated historical project.
  disputes: []
  changes:
    - date: 2026-07-21
      change: >
        Phase 1-R correction: pinned all raw GitHub URLs to commit
        849c2598abc7d2b40261e74b5826bc74ffc78308; added content_sha256 to every
        evidence record; relabeled all behavioral fields vendor-reported;
        set telemetry_behavior and sandboxing_model to unknown (absence of
        documentation is not a vendor claim); removed authored
        evidence_status and last_verified (now derived); split compound
        claims into one-record-per-source; removed unsupported surfaces.
