notes:
  summary: >
    OpenCode is an open-source (MIT) AI coding agent maintained by Anomaly
    (github.com/anomalyco), available as a terminal TUI, desktop app, IDE
    extension, web UI, and headless HTTP server. It supports 75+ model
    providers including local models (Ollama, LM Studio), implements the
    Model Context Protocol and its own Agent Skills system, and ships a
    per-tool permission system. Many factual fields are sourced from
    official docs and the canonical repository; privacy, retention, and
    pricing fields remain vendor-reported because no independent audit or
    formal policy document is available. The active project is
    github.com/anomalyco/opencode; github.com/opencode-ai/opencode is an
    archived, unrelated historical project. This is a Phase 1 vertical
    slice; no Kernux Run evidence exists yet.
  disputes: []
  changes:
    - date: 2026-07-21
      change: "Initial Phase 1 profile created from primary sources only."
